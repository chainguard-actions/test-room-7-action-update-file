name: Test with branch input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test file to update
        run: |
          echo "branch test content $(date)" > "$GITHUB_WORKSPACE/test-branch-file.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          commit-msg: "chore: update test file on branch"
          file-path: "test-branch-file.txt"
          github-token: ${{ github.token }}
          branch: main
      - name: Assert action ran with branch input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail at push (no write permissions in act), but it must have run
          # with the branch input provided. We verify it was invoked (not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with branch input"
