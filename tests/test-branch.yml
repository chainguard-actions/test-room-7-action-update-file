name: Test with branch input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test file to update
        run: |
          echo "branch test content $(date)" > test-branch-file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          commit-msg: "chore: test commit on specific branch"
          file-path: "test-branch-file.txt"
          github-token: ${{ env.GITHUB_TOKEN }}
          branch: "act-harness"
          committer-name: "test-bot"
          committer-email: "test-bot@example.com"
      - name: Assert action ran with branch input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with a fake token (can't push),
          # but we verify it was invoked with the branch input set.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with branch input"
