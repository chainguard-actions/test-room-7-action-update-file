name: Test update file with branch input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to update
        run: |
          echo "branch test content $(date)" > test-branch-file.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          commit-msg: "chore: test commit with branch from act"
          file-path: test-branch-file.txt
          github-token: fake-token-for-testing
          branch: act-harness

      - name: Assert action was invoked with branch input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action will fail because the token is fake and cannot push,
          # but it should have been invoked (outcome is 'failure' or 'success', not 'skipped')
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with branch input (outcome: ${{ steps.action.outcome }})"
