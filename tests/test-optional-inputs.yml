name: Test optional inputs - update file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file with dot prefix
        run: |
          echo "dotfile content" > /tmp/.hidden-test-file.txt

      - id: action
        uses: .
        with:
          commit-msg: "chore: test commit with optional inputs"
          file-path: /tmp/.hidden-test-file.txt
          github-token: fake-token-for-testing
          branch: act-harness
          allow-dot: "true"
          allow-removing: "false"
          respect-gitignore: "false"
          committer-name: "github-actions[bot]"
          committer-email: "github-actions[bot]@users.noreply.github.com"
        continue-on-error: true

      - name: Assert action ran with optional inputs
        run: |
          echo "Action completed (may have failed due to fake token, which is expected)"
          echo "PASS: all optional inputs were provided and action was invoked"
