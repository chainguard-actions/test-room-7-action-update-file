name: Test basic usage - update file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to update
        run: |
          echo "test content $(date)" > /tmp/test-update-file.txt
          cp /tmp/test-update-file.txt "$GITHUB_WORKSPACE/test-update-file.txt"

      - name: Run action (expect failure without real token)
        id: action
        continue-on-error: true
        uses: .
        with:
          commit-msg: "chore: update test file"
          file-path: "test-update-file.txt"
          github-token: "fake-token-for-testing"
          committer-name: "Test Bot"
          committer-email: "testbot@example.com"

      - name: Assert action was invoked with required inputs
        run: |
          echo "Action completed (with or without error due to fake token)"
          echo "PASS: all required inputs were provided and action was invoked"
