name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test file to update
        run: |
          echo "test content $(date)" > /tmp/test-update-file.txt
          cp /tmp/test-update-file.txt test-update-file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          commit-msg: "chore: test commit from action test"
          file-path: "test-update-file.txt"
          github-token: ${{ env.GITHUB_TOKEN }}
          committer-name: "test-bot"
          committer-email: "test-bot@example.com"
      - name: Assert action ran (may fail due to fake token)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with a fake token (can't push),
          # but we verify it was invoked with the correct inputs.
          # A failure due to authentication is acceptable here.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with required inputs"
