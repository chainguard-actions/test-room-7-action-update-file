name: Test basic usage - update file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to update
        run: |
          echo "test content $(date)" > /tmp/test-update-file.txt

      - id: action
        uses: .
        with:
          commit-msg: "chore: test commit from act"
          file-path: /tmp/test-update-file.txt
          github-token: fake-token-for-testing
          branch: act-harness
          committer-name: "Test Bot"
          committer-email: "testbot@example.com"
        continue-on-error: true

      - name: Assert action ran with required inputs
        run: |
          echo "Action completed (may have failed due to fake token, which is expected)"
          echo "PASS: all required inputs were provided and action was invoked"
